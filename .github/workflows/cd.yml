name: CD — Continuous Deployment

on:
  workflow_run:
    workflows: ["CI & Deployment"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/pages.yml
